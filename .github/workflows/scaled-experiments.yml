name: Scaled subtraction experiment archive
on:
  push:
    branches: ['experiments/scaled-subtraction']
  pull_request:
    paths: ['experiments/scaled-subtraction/**', '.github/workflows/scaled-experiments.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 experiments/scaled-subtraction/audit.py
      - run: python3 experiments/scaled-subtraction/prepare.py double-carry --output /tmp/verigmp-double-carry
      - run: python3 experiments/scaled-subtraction/prepare.py single-carry --output /tmp/verigmp-single-carry
      - run: python3 experiments/scaled-subtraction/prepare.py split-slow-path --output /tmp/verigmp-split-slow-path
