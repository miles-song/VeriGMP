name: Toom-4 signed evaluation experiment archive
on:
  push:
    branches: [experiments/toom4-signed-eval, 'main', 'acceptance/experiment-archives-main']
  pull_request:
    paths: [experiments/toom4-signed-eval/**, .github/workflows/toom4-signed-eval-experiment.yml]
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 experiments/toom4-signed-eval/audit.py
      - run: python3 experiments/toom4-signed-eval/prepare.py --output /tmp/verigmp-toom4-signed-eval
