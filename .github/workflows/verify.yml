name: Arithmetic refinement
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verus:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y g++ libgmp-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: deps/verus-download
          key: verus-linux-${{ hashFiles('native/toolchain.json') }}
      - run: python3 scripts/setup_verus.py
      - run: python3 scripts/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arithmetic-refinement-linux
          path: results/
          if-no-files-found: error
