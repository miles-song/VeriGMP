name: Toom-4 interpolation fusion experiment archive
on:
  push:
    branches: [experiments/toom4-fusion]
  pull_request:
    paths: [experiments/toom4-fusion/**, .github/workflows/toom4-fusion-experiment.yml]
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 experiments/toom4-fusion/audit.py
      - run: python3 experiments/toom4-fusion/prepare.py --output /tmp/verigmp-toom4-fusion
