name: Odd exact division experiment archive
on:
  push:
    branches: [experiments/odd-division]
  pull_request:
    paths: [experiments/odd-division/**, .github/workflows/odd-division-experiment.yml]
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 experiments/odd-division/audit.py
      - run: python3 experiments/odd-division/prepare.py --output /tmp/verigmp-odd-division
