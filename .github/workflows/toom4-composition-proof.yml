name: Toom-4 composition proof matrix
on:
  push:
    branches: ['feature/toom4-composition-policy']
    paths:
      - 'experiments/toom4-composition/**'
      - '.github/workflows/toom4-composition-proof.yml'
      - 'native/toolchain.json'
      - 'scripts/setup_verus.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze exact checkout and prepared inputs
        shell: bash
        run: |
          python3 experiments/toom4-composition/ci_test.py
          python3 experiments/toom4-composition/ci.py prepare --output results/toom4-composition-ci
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(python3 -c 'import json; print(json.load(open("native/toolchain.json"))["rust_toolchain"])')
          rustup toolchain install "$toolchain" --profile minimal 2>&1 | tee results/toom4-composition-ci/rustup-setup.log
      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update 2>&1 | tee results/toom4-composition-ci/apt-update.log
          sudo apt-get install -y g++ libgmp-dev binutils 2>&1 | tee results/toom4-composition-ci/apt-install.log
      - name: Install checksum-pinned Verus archive
        shell: bash
        run: python3 scripts/setup_verus.py 2>&1 | tee results/toom4-composition-ci/verus-setup.log
      - name: Prove, compile, oracle-check and inspect linked entries
        env:
          VERUS_BIN: ${{ github.workspace }}/deps/verus/verus-x86-linux/verus
          RUSTUP_TOOLCHAIN: 1.99.1-x86_64-unknown-linux-gnu
        run: python3 experiments/toom4-composition/ci.py run --output results/toom4-composition-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: toom4-composition-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/toom4-composition-ci/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
